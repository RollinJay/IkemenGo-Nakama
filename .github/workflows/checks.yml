# Checks every pull request (dependabot's included) and every push to the
# main branches: module files, formatting, the CBR package's tests, and a
# Linux build with the engine's tests. Release packages for every platform
# come from releases.yml.
on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

name: checks

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: module files, formatting and CBR tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Module files are tidy
        run: go mod tidy -diff

      - name: Formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l src)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: CBR package
        run: |
          go vet ./src/cbr/...
          go test ./src/cbr/...

  linux:
    name: Linux build and engine tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev xorg-dev libgtk-3-dev \
            build-essential pkg-config git yasm nasm curl ca-certificates libxmp-dev libsdl2-dev

      # build.sh reuses a finished FFmpeg build (its install prefix and the
      # configuration header it checks) instead of building it again.
      - name: Restore the FFmpeg build
        uses: actions/cache@v6
        with:
          path: |
            build/ffmpeg
            build/ffmpeg-src/config_components.h
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('build/build.sh') }}

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOEXPERIMENT: "arenas"
          APP_VERSION: checks
        run: ./build/build.sh Linux

      # The same cgo flags build.sh uses for Linux. The test binary runs from
      # a temporary folder, so it finds FFmpeg's shared libraries through
      # LD_LIBRARY_PATH rather than the game's own lib/ folder.
      - name: Engine tests
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOEXPERIMENT: "arenas"
        run: |
          export PKG_CONFIG_PATH="$PWD/build/ffmpeg/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$PWD/build/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          libs=(libavformat libavcodec libavutil libswscale libswresample libavfilter libxmp sdl2)
          CGO_CFLAGS="$(pkg-config --cflags "${libs[@]}")"
          CGO_LDFLAGS="$(pkg-config --libs "${libs[@]}") -lpthread -lm -ldl -lz"
          export CGO_CFLAGS CGO_LDFLAGS
          # Upstream engine code fails the vet checks go test runs by default.
          go test -vet=off ./src
